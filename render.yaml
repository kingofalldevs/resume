# Render.com Blueprint for ResumeGhana
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: resumeghana
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:app" -b 0.0.0.0:$PORT -w 1 -t 120 --access-logfile - --log-level info
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: HF_API_TOKEN
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: resumeghana-db
          property: connectionString

databases:
  - name: resumeghana-db
    databaseName: resumeghana
    plan: free
