{% extends "base.html" %}

{% block extra_css %}
<style>
    .form-card { background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; padding: 2rem; max-width: 560px; margin: 0 auto; }
    .form-title { color: #111827; font-weight: 800; font-size: 1.75rem; margin-bottom: 0.5rem; }
    .form-sub { color: #6b7280; font-size: 0.95rem; margin-bottom: 1.75rem; }
    .form-label { display: block; font-weight: 600; font-size: 0.9rem; color: #374151; margin-bottom: 0.5rem; }
    .form-input { width: 100%; padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; transition: border-color 0.2s, box-shadow 0.2s; }
    .form-input:focus { outline: none; border-color: #ff6600; box-shadow: 0 0 0 3px rgba(255,102,0,0.15); }
    .form-input::placeholder { color: #9ca3af; }
    .form-group { margin-bottom: 1.25rem; }
    .form-btn { width: 100%; background: #ff6600; color: white; border: none; border-radius: 10px; padding: 0.9rem 1rem; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
    .form-btn:hover { opacity: 0.92; }
    .form-back { display: inline-flex; align-items: center; gap: 0.5rem; color: #ff6600; font-weight: 600; font-size: 0.9rem; margin-bottom: 1.5rem; transition: opacity 0.2s; }
    .form-back:hover { opacity: 0.8; color: #ff6600; }
</style>
{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <a href="{{ url_for('dashboard.index') }}" class="form-back"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>

    <div class="form-card">
        <h1 class="form-title">Book an Interview</h1>
        <p class="form-sub">Schedule a mock interview or career consultation. Our team will contact you to confirm.</p>

        <form method="POST" action="{{ url_for('dashboard.book_interview') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label" for="company">Company / Job Title *</label>
                <input type="text" id="company" name="company" required class="form-input" placeholder="e.g. MTN Ghana, Software Engineer" value="{{ request.form.get('company', '') }}">
            </div>
            <div class="form-group">
                <label class="form-label" for="job_role">Role You're Applying For *</label>
                <input type="text" id="job_role" name="job_role" required class="form-input" placeholder="e.g. Junior Developer, Marketing Manager" value="{{ request.form.get('job_role', '') }}">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="form-group">
                    <label class="form-label" for="preferred_date">Preferred Date *</label>
                    <input type="date" id="preferred_date" name="preferred_date" required class="form-input" value="{{ request.form.get('preferred_date', '') }}">
                </div>
                <div class="form-group">
                    <label class="form-label" for="preferred_time">Preferred Time *</label>
                    <input type="time" id="preferred_time" name="preferred_time" required class="form-input" value="{{ request.form.get('preferred_time', '') }}">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" required class="form-input" placeholder="+233 XX XXX XXXX" value="{{ request.form.get('phone', '') }}">
            </div>
            <div class="form-group">
                <label class="form-label" for="notes">Notes (optional)</label>
                <textarea id="notes" name="notes" rows="3" class="form-input resize-none" placeholder="Any specific focus areas or questions...">{{ request.form.get('notes', '') }}</textarea>
            </div>
            <button type="submit" class="form-btn mt-2 relative" id="submit-btn"><span class="btn-text">Submit Request</span></button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function () {
    var form = document.querySelector('form');
    var btn = document.getElementById('submit-btn');
    if (form && btn) {
        form.addEventListener('submit', function () {
            btn.classList.add('btn-loading');
            btn.disabled = true;
        });
    }
})();
</script>
{% endblock %}
