{% extends "base.html" %}

{% block extra_css %}
<style>
    .otp-wrap { max-width: 560px; margin: 3rem auto 0; padding: 0 0.75rem; }
    .otp-card {
        background: rgba(255, 255, 255, 0.96);
        border-radius: 20px;
        box-shadow: 0 18px 34px rgba(255, 102, 0, 0.12);
        padding: 1.6rem;
    }
    .otp-title { color: #ff6600; font-weight: 900; letter-spacing: -0.02em; }
    .otp-sub { color: rgba(255, 102, 0, 0.75); }
    .otp-input {
        width: 100%;
        text-align: center;
        letter-spacing: 0.35em;
        font-size: 1.2rem;
        border: 1px solid rgba(255, 102, 0, 0.2);
        color: #ff6600;
        padding: 0.85rem 1rem;
        border-radius: 12px;
        background: #fff;
    }
    .otp-input:focus {
        outline: none;
        border-color: #ff6600;
        box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.12);
    }
    .otp-btn {
        width: 100%;
        background: #ff6600;
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 0.8rem 1rem;
        font-weight: 700;
    }
    .otp-btn:hover { opacity: 0.92; }
</style>
{% endblock %}

{% block content %}
<section class="otp-wrap">
    <div class="otp-card">
        <h1 class="otp-title text-2xl sm:text-3xl mb-2 text-center">Verify Login</h1>
        <p class="otp-sub text-center mb-6">
            We sent a 6-digit verification code to <strong>{{ masked_email }}</strong>.
        </p>
        <form method="POST" action="{{ url_for('auth.verify_otp') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-sm font-semibold text-[#ff6600] mb-2">One-time code</label>
                <input
                    type="text"
                    name="otp"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    pattern="\d{6}"
                    maxlength="6"
                    required
                    class="otp-input"
                    placeholder="000000"
                >
            </div>
            <button type="submit" class="otp-btn relative" id="verify-btn">
                <span class="btn-text">Verify and Continue</span>
            </button>
        </form>
        <p class="text-center mt-4 text-sm otp-sub">
            Didn’t get the code? Return to <a href="{{ url_for('auth.login') }}" class="font-bold text-[#ff6600]">Login</a> and try again.
        </p>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    (function () {
        const form = document.querySelector("form");
        const btn = document.getElementById("verify-btn");
        if (form && btn) {
            form.addEventListener("submit", function () {
                btn.classList.add("btn-loading");
                btn.disabled = true;
            });
        }
    }());
</script>
{% endblock %}
